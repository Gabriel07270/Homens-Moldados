const W=[{"p": "Jeremias 18:1-6", "t": "O Oleiro e o barro", "v": "Isaías 64:8", "i": "Deus é o Oleiro e nós somos o barro.", "d": "Entregue a Deus uma área da sua vida para ser moldada."}, {"p": "Salmo 1", "t": "Plantado junto às águas", "v": "Salmo 1:3", "i": "O homem firme tem raízes na Palavra.", "d": "Leia um salmo por dia e anote uma frase."}, {"p": "Gênesis 2:15-25", "t": "Chamado para trabalhar e guardar", "v": "Gênesis 2:15", "i": "Deus deu ao homem trabalho e responsabilidade.", "d": "Faça com excelência uma tarefa que vinha adiando."}, {"p": "Josué 24:14-18", "t": "Eu e a minha casa", "v": "Josué 24:15", "i": "Cabe ao homem escolher servir ao Senhor com a sua casa.", "d": "Reúna a família para orar uma vez esta semana."}, {"p": "Gênesis 22:1-14", "t": "Abraão: obediência que confia", "v": "Gênesis 22:12", "i": "Obedecer a Deus é confiar nele mesmo sem entender.", "d": "Obedeça hoje a algo que Deus já lhe mostrou."}, {"p": "Gênesis 39:1-12", "t": "José: integridade na tentação", "v": "Gênesis 39:9", "i": "Quem teme a Deus foge do pecado, mesmo em segredo.", "d": "Retire da sua vida uma fonte de tentação."}, {"p": "Daniel 1:1-21", "t": "Daniel: convicção", "v": "Daniel 1:8", "i": "A convicção firme protege em ambientes difíceis.", "d": "Decida antecipadamente um \"não\" que manterá."}, {"p": "Josué 1:1-9", "t": "Forte e corajoso", "v": "Josué 1:9", "i": "A coragem vem da presença de Deus.", "d": "Dê um passo de coragem que vinha evitando."}, {"p": "Salmo 51:1-12", "t": "Davi: arrependimento", "v": "Salmo 51:10", "i": "Deus restaura o homem que confessa o pecado.", "d": "Confesse a Deus e a um irmão de confiança uma falha."}, {"p": "Êxodo 3:1-12", "t": "Moisés: o chamado", "v": "Êxodo 3:12", "i": "Deus chama pessoas que se acham incapazes.", "d": "Ofereça-se para servir em algo na igreja."}, {"p": "Juízes 6:11-16", "t": "Gideão: Deus vê força", "v": "Juízes 6:12", "i": "Deus vê em nós o que ainda não vemos.", "d": "Agradeça a Deus por um dom que Ele lhe deu."}, {"p": "Neemias 2:11-20", "t": "Neemias: homem de visão", "v": "Neemias 2:18", "i": "Quem ora e planeia reconstrói o que está caído.", "d": "Escreva um plano concreto para uma área em ruínas."}, {"p": "Tiago 1:19-27", "t": "Ouvintes e praticantes", "v": "Tiago 1:22", "i": "Ouvir sem praticar é enganar-se a si mesmo.", "d": "Pratique uma coisa que aprendeu neste trimestre."}, {"p": "Efésios 5:25-33", "t": "Amar como Cristo amou", "v": "Efésios 5:25", "i": "O marido ama com sacrifício e serviço.", "d": "Faça hoje algo que sirva a sua esposa sem pedir."}, {"p": "1 Pedro 3:1-7", "t": "Viver com entendimento", "v": "1 Pedro 3:7", "i": "Honrar a esposa abre caminho para a oração.", "d": "Pergunte à sua esposa como pode ajudá-la mais."}, {"p": "Deuteronômio 6:4-9", "t": "O pai que ensina", "v": "Deuteronômio 6:6-7", "i": "A fé passa de pai para filho no dia a dia.", "d": "Conte aos seus filhos uma história bíblica."}, {"p": "Efésios 6:1-4", "t": "Sem irritar os filhos", "v": "Efésios 6:4", "i": "Educar é conduzir com amor, não com ira.", "d": "Peça perdão a um filho por uma reacção dura."}, {"p": "Hebreus 12:5-11", "t": "Disciplina e graça", "v": "Hebreus 12:11", "i": "Deus disciplina por amor, e o pai imita-O.", "d": "Corrija um filho com calma e explique o porquê."}, {"p": "Gênesis 2:18-25", "t": "Uma só carne", "v": "Gênesis 2:24", "i": "O casamento é aliança, não contrato.", "d": "Marque um tempo a sós com a sua esposa."}, {"p": "1 Timóteo 5:1-8", "t": "Prover para a família", "v": "1 Timóteo 5:8", "i": "Prover é dever e acto de fé.", "d": "Reveja o orçamento da casa com a sua esposa."}, {"p": "Colossenses 3:12-21", "t": "Paz no lar", "v": "Colossenses 3:19", "i": "A paz da casa começa em quem lidera com mansidão.", "d": "Elogie hoje, em voz alta, cada pessoa da casa."}, {"p": "Lucas 15:11-24", "t": "O pai que espera", "v": "Lucas 15:20", "i": "Deus-Pai corre ao encontro de quem volta.", "d": "Reconcilie-se com um familiar afastado."}, {"p": "Jó 1:1-5", "t": "Jó: sacerdote da casa", "v": "Jó 1:5", "i": "O pai intercede pela sua família.", "d": "Ore pelo nome de cada familiar durante a semana."}, {"p": "Romanos 12:14-21", "t": "Procurar a paz", "v": "Romanos 12:18", "i": "A paz procura-se, tanto quanto depende de nós.", "d": "Procure a paz com alguém com quem está em conflito."}, {"p": "Mateus 7:24-27", "t": "Casa na rocha", "v": "Mateus 7:24", "i": "Praticar a Palavra dá firmeza à casa.", "d": "Defina um hábito de Palavra em família."}, {"p": "Salmo 127", "t": "Se o Senhor não edificar", "v": "Salmo 127:1", "i": "Sem o Senhor, o esforço do homem é vão.", "d": "Consagre a sua casa ao Senhor em oração."}, {"p": "Jó 1:13-22", "t": "Jó: tudo perdido, Deus fiel", "v": "Jó 1:21", "i": "Podemos adorar a Deus mesmo na perda.", "d": "Louve a Deus por uma coisa, apesar da sua dor."}, {"p": "Gênesis 50:15-21", "t": "José: do mal ao bem", "v": "Gênesis 50:20", "i": "Deus transforma o mal em bem.", "d": "Perdoe, em oração, quem lhe fez mal."}, {"p": "Salmo 42", "t": "Alma abatida", "v": "Salmo 42:5", "i": "O homem também se abate, e deve falar com Deus.", "d": "Fale com um irmão sobre o que o pesa."}, {"p": "1 Reis 19:1-18", "t": "Elias: esgotado", "v": "1 Reis 19:12", "i": "Deus cuida do cansaço e fala em voz mansa.", "d": "Descanse bem e reserve um tempo de silêncio."}, {"p": "2 Coríntios 12:7-10", "t": "Força na fraqueza", "v": "2 Coríntios 12:9", "i": "A graça de Deus basta na nossa fraqueza.", "d": "Admita diante de alguém uma fraqueza sua."}, {"p": "Salmo 23", "t": "O Senhor é o meu pastor", "v": "Salmo 23:4", "i": "Deus caminha connosco no vale.", "d": "Decore o Salmo 23 e diga-o quando tiver medo."}, {"p": "Filipenses 4:6-13", "t": "Entregar a ansiedade", "v": "Filipenses 4:6", "i": "Em vez de ansiedade, oração com gratidão.", "d": "Escreva três pedidos e três agradecimentos."}, {"p": "Tiago 1:2-12", "t": "Fé provada", "v": "Tiago 1:2-3", "i": "As provações produzem perseverança.", "d": "Anime um irmão que está em prova."}, {"p": "Hebreus 12:1-3", "t": "Correr com perseverança", "v": "Hebreus 12:1", "i": "Corremos com os olhos em Jesus.", "d": "Largue um peso que o atrasa na caminhada."}, {"p": "Daniel 3:13-27", "t": "Fornalha de fogo", "v": "Daniel 3:17-18", "i": "A fé firme confia em Deus, mesmo sem milagre.", "d": "Mantenha uma decisão difícil por fidelidade a Deus."}, {"p": "Romanos 5:1-5", "t": "Esperança que não confunde", "v": "Romanos 5:3-4", "i": "A prova gera carácter e esperança.", "d": "Anote o que Deus lhe ensinou numa prova passada."}, {"p": "Mateus 6:25-34", "t": "Sem andar ansioso", "v": "Mateus 6:33", "i": "Quem busca o Reino primeiro será sustentado.", "d": "Entregue a Deus uma preocupação financeira."}, {"p": "Isaías 40:28-31", "t": "Renovar as forças", "v": "Isaías 40:31", "i": "Os que esperam no Senhor renovam as forças.", "d": "Reserve 15 minutos diários só para esperar em Deus."}, {"p": "Marcos 10:35-45", "t": "Grandeza é servir", "v": "Marcos 10:45", "i": "O líder segue o exemplo do Servo.", "d": "Sirva alguém em segredo, sem esperar crédito."}, {"p": "João 13:1-17", "t": "O lava-pés", "v": "João 13:14", "i": "Humildade é lavar os pés uns dos outros.", "d": "Faça uma tarefa humilde na igreja ou em casa."}, {"p": "Atos 6:1-7", "t": "Homens cheios do Espírito", "v": "Atos 6:3", "i": "A igreja precisa de homens de bom testemunho.", "d": "Ofereça-se para um serviço concreto na igreja."}, {"p": "1 Timóteo 3:1-13", "t": "Carácter do líder", "v": "1 Timóteo 3:2", "i": "A liderança cristã começa pelo carácter.", "d": "Peça a um irmão que avalie o seu carácter."}, {"p": "Êxodo 18:13-27", "t": "Partilhar a carga", "v": "Êxodo 18:21", "i": "O bom líder partilha responsabilidades.", "d": "Delegue uma tarefa e confie em quem a recebe."}, {"p": "Romanos 12:1-8", "t": "Dons ao serviço", "v": "Romanos 12:1", "i": "Entregamo-nos a Deus e usamos os nossos dons.", "d": "Identifique o seu dom e use-o esta semana."}, {"p": "Mateus 28:16-20", "t": "Ir e fazer discípulos", "v": "Mateus 28:19", "i": "Todo homem é enviado a fazer discípulos.", "d": "Convide um homem para o próximo encontro."}, {"p": "Eclesiastes 4:9-12", "t": "Irmãos que se sustentam", "v": "Eclesiastes 4:12", "i": "O cordão de três dobras não se rompe facilmente.", "d": "Escolha um irmão para prestação de contas mútua."}, {"p": "Efésios 4:1-16", "t": "Um corpo, muitos dons", "v": "Efésios 4:15", "i": "Crescemos juntos falando a verdade em amor.", "d": "Diga uma palavra de encorajamento a um irmão."}, {"p": "Tito 2:1-8", "t": "Exemplo para os mais novos", "v": "Tito 2:7", "i": "Os homens ensinam mais pelo exemplo.", "d": "Acompanhe um rapaz jovem durante a semana."}, {"p": "2 Timóteo 2:1-7", "t": "Passar adiante", "v": "2 Timóteo 2:2", "i": "O que aprendemos, ensinamos a outros fiéis.", "d": "Partilhe com um homem o que aprendeu este ano."}, {"p": "Gálatas 6:7-10", "t": "Não nos cansemos", "v": "Gálatas 6:9", "i": "Quem semeia no Espírito colhe no tempo certo.", "d": "Persevere numa boa obra que o está a cansar."}, {"p": "2 Timóteo 4:6-8", "t": "Terminar bem", "v": "2 Timóteo 4:7", "i": "O alvo é terminar a corrida com fé.", "d": "Escreva uma oração de compromisso para o próximo ano."}];const E={"1": {"c": "Deus manda Jeremias à casa do oleiro. O povo está em crise e Deus quer ensinar-lhe, com uma cena simples, quem manda e quem molda.", "p": [["O vaso estragou-se, e o oleiro refez (v. 3-4)", "O vaso de barro estragou-se na mão do oleiro. Ele não deitou o barro fora: fez dele outro vaso. Deus também refaz quem falhou."], ["O oleiro tem o direito de moldar (v. 5-6)", "Deus pergunta se não pode fazer connosco o que o oleiro faz. A autoridade de Deus sobre nós serve para refazer, não para destruir."], ["O barro está nas mãos do oleiro (v. 6)", "Ser moldado exige ficar nas mãos de Deus. O barro que foge da roda não pode tornar-se vaso."]], "q": ["Que parte da sua vida está estragada na roda e precisa de ser refeita?", "O que mais lhe custa na hora de ser moldado: o tempo, a dor ou perder o controlo?", "Em que área tem resistido à mão de Deus?"]}, "2": {"c": "O Salmo 1 abre o livro dos Salmos e apresenta dois caminhos: o do homem que Deus abençoa e o do que se perde.", "p": [["O que o homem feliz evita (v. 1)", "Andar, parar e sentar-se com os ímpios: o conselho primeiro caminha ao lado, depois fica e por fim senta-se. O pecado avança por etapas."], ["Onde o homem feliz se deleita (v. 2)", "Ele gosta da lei do Senhor e medita nela dia e noite. A Palavra não é um dever pesado, é a sua fonte de alegria."], ["A árvore e a pragana (v. 3-4)", "Quem está plantado junto a ribeiros dá fruto no tempo certo. Os ímpios são como a palha que o vento leva."]], "q": ["Que conselhos tem ouvido que o afastam de Deus?", "Quando e como medita na Palavra durante a semana?", "Que fruto quer que Deus produza na sua vida?"]}, "3": {"c": "Antes de qualquer pecado, Deus põe o homem no jardim com tarefa, limite e companhia. Estas bases continuam a valer.", "p": [["Trabalhar e guardar (v. 15)", "O trabalho vem antes da queda: é dom de Deus. Guardar quer dizer proteger e cuidar do que Deus nos confia."], ["Liberdade com limites (v. 16-17)", "Deus dá abundância e um só limite. A obediência faz parte da boa vida do homem."], ["Não é bom estar só (v. 18-24)", "Deus dá ao homem uma ajudadora e funda o casamento: deixar pai e mãe e unir-se à esposa. Fomos criados para a comunhão."]], "q": ["Vê o seu trabalho como serviço a Deus?", "O que significa guardar a sua casa, o seu trabalho e a sua igreja?", "Em que áreas tenta viver sozinho, sem irmãos?"]}, "4": {"c": "Josué já é idoso. Reúne o povo em Siquém e pede que renove a aliança com o Senhor.", "p": [["Servir com integridade (v. 14)", "Temer o Senhor e servi-lo com verdade, e deitar fora os outros deuses. Não se serve a dois senhores."], ["A escolha é pessoal e é da casa (v. 15)", "Josué diz: escolhei hoje a quem serviréis. A sua decisão é clara: eu e a minha casa serviremos ao Senhor."], ["Lembrar as obras de Deus (v. 16-18)", "O povo recorda o que Deus fez e responde: também serviremos. A memória sustenta a fidelidade."]], "q": ["Que deuses (dinheiro, trabalho, prestígio, desporto) competem com Deus na sua vida?", "Em que área da casa já escolheu servir a Deus, e onde ainda falta?", "Que obras de Deus recorda para sustentar a sua escolha?"]}, "5": {"c": "Anos depois da promessa de um filho, Deus prova Abraão. É um dos textos mais exigentes da Bíblia.", "p": [["Obedecer logo (v. 1-3)", "Deus prova Abraão, e Abraão madruga para obedecer. Não discute nem adia."], ["O Senhor proverá (v. 7-8)", "Isaque pergunta pelo cordeiro. Abraão responde que Deus proverá. Confiar é avançar sem ver a solução."], ["Deus provê (v. 11-14)", "O anjo detém Abraão e Deus mostra um carneiro. Abraão dá ao lugar o nome de O Senhor proverá."]], "q": ["O que Deus lhe pede que lhe é caro demais?", "O que o impede de obedecer cedo, sem adiar?", "Quando viu Deus prover no último momento?"]}, "6": {"c": "José é escravo no Egito, na casa de Potifar, longe da família e sem testemunhas. É aí que a sua integridade é posta à prova.", "p": [["O Senhor estava com José (v. 2-6)", "José prosperou e foi confiado em tudo. A presença de Deus faz a diferença mesmo na escravidão."], ["A tentação insiste (v. 7-10)", "A mulher de Potifar insiste dia após dia. José recusa pela razão certa: pecar contra Deus, e não apenas ser descoberto."], ["Fugir (v. 11-12)", "Quando a conversa não resolve, José foge e deixa a roupa. Fugir também é coragem."]], "q": ["Onde é mais tentado: olhos, dinheiro, orgulho ou ira?", "Que tentações o perseguem dia após dia?", "O que significa fugir, na prática, esta semana?"]}, "7": {"c": "Daniel é levado jovem para a Babilónia e a corte tenta reeducá-lo para pensar como os babilónios.", "p": [["Um sistema que molda (v. 1-7)", "Dão-lhe novo nome, nova língua e nova mesa. A pressão para mudar a identidade é real."], ["Propôs no coração (v. 8)", "Daniel decidiu antes de ser pressionado que não se contaminaria. A convicção firma-se antes da prova."], ["Firme e respeitoso (v. 9-20)", "Daniel pede com respeito uma alternativa e Deus dá-lhe favor. Os resultados mostraram a diferença."]], "q": ["Que pressões do seu ambiente tentam mudar a sua identidade?", "Em que ponto precisa de decidir hoje, antes da pressão chegar?", "Como pode ser firme sem ser arrogante?"]}, "8": {"c": "Moisés morreu. Josué assume a liderança do povo e vai atravessar o Jordão para entrar na terra prometida.", "p": [["Deus promete a sua presença (v. 1-5)", "Como fui com Moisés, serei contigo. A coragem nasce da promessa, não do carácter."], ["Sê forte e corajoso (v. 6-9)", "Deus repete a ordem várias vezes, porque Josué teria medo. Coragem não é ausência de medo."], ["Coragem ligada à Palavra (v. 8)", "O livro da lei não se aparta da boca de Josué. Quem medita na Palavra caminha com firmeza."]], "q": ["Que Jordão tem diante de si agora?", "Por que Deus liga a coragem à meditação da Palavra?", "Como a presença de Deus muda o seu medo?"]}, "9": {"c": "Davi escreve este salmo depois do pecado com Bate-Seba e do arrependimento que veio com a palavra do profeta Natã (2 Samuel 11-12).", "p": [["Reconhecer o pecado (v. 1-4)", "Davi apela à misericórdia de Deus sem se justificar. Chama ao pecado pelo nome."], ["Pedir purificação (v. 5-9)", "Pede para ser lavado e limpo. Só Deus pode limpar o coração."], ["Pedir um coração novo (v. 10-12)", "Davi não quer só ser perdoado. Pede um coração puro e a alegria da salvação de volta."]], "q": ["Que pecado tem escondido?", "Por que ajuda confessar a um irmão de confiança?", "O que muda quando pede um coração puro e não só perdão?"]}, "10": {"c": "Moisés é pastor em Midiã, há muitos anos longe do Egito. Deus encontra-o numa sarça que arde sem se consumir.", "p": [["Deus chama pelo nome (v. 1-6)", "Deus chama Moisés duas vezes e declara santo o lugar. O encontro com Deus muda o chão onde pisamos."], ["Deus vê e envia (v. 7-10)", "Deus viu a aflição do povo, ouviu o seu clamor e desceu. Depois envia Moisés. Deus age e chama-nos a participar."], ["Quem sou eu? (v. 11-12)", "Moisés acha-se incapaz. Deus não discute a sua fraqueza: responde que será com ele."]], "q": ["Qual é a sua desculpa para não servir?", "O que Deus já vê e ouve à sua volta?", "Onde sente que Deus o envia?"]}, "11": {"c": "Israel está oprimido pelos midianitas. Gideão debulha trigo às escondidas num lagar, com medo.", "p": [["Valente enquanto se esconde (v. 11-12)", "O anjo chama-lhe homem valente quando ele estava escondido. Deus vê o que ainda não somos."], ["Vai nesta tua força (v. 13-14)", "Gideão questiona onde estão os milagres. Deus responde com uma ordem e com a sua força."], ["Eu serei contigo (v. 15-16)", "Gideão diz que a sua família é a mais pobre. Deus não corrige o argumento: promete estar com ele."]], "q": ["Que rótulo (fraco, pobre, incapaz) lhe pesa?", "O que Deus mostra de si, diferente do que vê no espelho?", "Que passo Deus lhe pede nesta força?"]}, "12": {"c": "Neemias é copeiro do rei na Pérsia. Ao saber que Jerusalém está em ruínas, ora, pede licença e volta para reconstruir.", "p": [["Ver antes de falar (v. 11-16)", "Neemias inspecciona as muralhas de noite e em silêncio. Planeia antes de falar."], ["Partilhar a visão (v. 17-18)", "Mostra o problema e conta como Deus o guiou. Convida: levantemo-nos e edifiquemos."], ["Responder à oposição com fé (v. 19-20)", "Zombam e acusam-nos. Neemias responde que o Deus dos céus os fará prosperar."]], "q": ["Que muralha caída vê na sua família ou na igreja?", "Já examinou a situação antes de agir?", "Como reage à crítica quando tenta fazer o bem?"]}, "13": {"c": "Tiago escreve a cristãos dispersos e insiste numa fé que se vê na vida do dia a dia.", "p": [["Ouvir, falar e irar-se (v. 19-21)", "Prontos para ouvir, tardios para falar e para a ira. Recebamos a Palavra com mansidão."], ["Praticantes, não só ouvintes (v. 22-25)", "Quem ouve e não pratica é como quem olha o rosto no espelho e esquece como é."], ["Religião pura (v. 26-27)", "Controlar a língua e cuidar de órfãos e viúvas, e guardar-se limpo do mundo."]], "q": ["Qual destes três lhe custa mais: ouvir, falar ou controlar a ira?", "O que ouviu na Palavra e já esqueceu?", "Que órfão ou viúva pode visitar esta semana?"]}, "14": {"c": "Paulo instrui as famílias de Éfeso. O texto fala aos maridos depois de pedir que todos se sujeitem uns aos outros.", "p": [["Amar como Cristo amou (v. 25)", "Cristo amou a igreja e entregou-se por ela. O amor do marido mede-se pelo que dá, e não pelo que recebe."], ["Procurar o bem da esposa (v. 26-27)", "Cristo purifica e prepara a sua igreja. O marido cuida também da vida espiritual da esposa."], ["Cuidar como do próprio corpo (v. 28-33)", "Quem ama a esposa ama-se a si mesmo: sustenta-a e cuida dela. O casamento aponta para Cristo e a igreja."]], "q": ["Em que áreas o seu amor é mais de palavras do que de entrega?", "Como pode cuidar da vida espiritual da sua esposa?", "O que significa sustentar e cuidar na rotina da sua casa?"]}, "15": {"c": "Pedro escreve a cristãos que sofrem. Fala às esposas nos versículos 1 a 6 e aos maridos no versículo 7. O estudo centra-se nesse versículo.", "p": [["Viver com entendimento (v. 7)", "O marido deve conhecer a esposa: o que a pesa, a alegra e a cansa. Viver juntos sem a conhecer é viver à superfície."], ["Dar honra (v. 7)", "A honra mostra-se em atitudes: ouvir, proteger, valorizar. Os dois são herdeiros juntos da graça da vida."], ["Oração em jogo (v. 7)", "Pedro diz que, sem esta honra, as orações do marido encontram obstáculos. O lar e a oração estão ligados."]], "q": ["O que sabe hoje sobre os medos e sonhos da sua esposa?", "Como honra a sua esposa em público e em casa?", "O que mudaria na sua oração se tratasse melhor a sua casa?"]}, "16": {"c": "Moisés prepara uma nova geração antes de entrar na terra prometida. Este texto é conhecido como o Shema, a grande confissão de Israel.", "p": [["Amar a Deus por inteiro (v. 4-5)", "O Senhor é um só e merece todo o coração, alma e força. O pai ensina primeiro pelo que ama."], ["Ensinar no dia a dia (v. 6-7)", "As palavras de Deus estarão no coração do pai e serão ensinadas com diligência aos filhos: em casa, no caminho, ao deitar e ao levantar."], ["Sinais visíveis (v. 8-9)", "Atar na mão, pôr entre os olhos, escrever nos umbrais: a fé deve ser visível na casa."]], "q": ["Quando fala de Deus com os seus filhos na prática?", "Que rotina de casa pode tornar-se momento de ensino?", "Que sinais visíveis de fé existem na sua casa?"]}, "17": {"c": "Paulo dirige-se aos filhos e depois aos pais. O versículo 4 é a palavra para os pais.", "p": [["Um mandamento com promessa (v. 1-3)", "Os filhos devem honrar os pais, e Deus ata a essa honra uma promessa. O pai deve ser digno de ser honrado."], ["Não provocar à ira (v. 4a)", "Exigir sem explicar, comparar, humilhar e ser injusto irritam os filhos. O pai pode estar certo e ainda assim ferir."], ["Criar no Senhor (v. 4b)", "Pais devem criar os filhos na disciplina e na admoestação do Senhor, com presença e instrução."]], "q": ["Que atitudes suas podem estar irritando os seus filhos?", "Quando foi a última vez que pediu perdão a um filho?", "Que tempo dedica a instruir os seus filhos na fé?"]}, "18": {"c": "Os cristãos hebreus sofriam por causa da fé. O autor mostra o sofrimento como disciplina de um Pai que ama.", "p": [["O Senhor corrige quem ama (v. 5-6)", "A correcção de Deus é sinal de amor, e não de rejeição. Não devemos desprezá-la nem desanimar."], ["Prova de filiação (v. 7-9)", "Os filhos são corrigidos pelos pais. Respeitamos os pais que nos corrigiram, e mais ainda devemos submeter-nos ao Pai dos espíritos."], ["Para o nosso bem (v. 10-11)", "A disciplina custa no momento, mas dá fruto de paz e justiça. Deus disciplina com propósito, e o pai deve imitá-Lo."]], "q": ["Como reage quando Deus o corrige?", "A sua disciplina em casa tem propósito ou nasce da raiva?", "O que precisa de mudar para corrigir com calma e com amor?"]}, "19": {"c": "Deus, e não o homem, inventou o casamento. Gênesis 2 explica o desenho de Deus antes de qualquer pecado.", "p": [["Deus vê a solidão (v. 18-20)", "Entre todos os animais, não havia ajudadora para o homem. O casamento é resposta de Deus à nossa necessidade de companhia."], ["Alegria da comunhão (v. 21-23)", "Ao ver a mulher, o homem exulta. A mulher é parceira, e não rival."], ["Deixar, unir-se, ser uma só carne (v. 24-25)", "O casal deixa os pais, une-se com compromisso e vive em intimidade sem vergonha. A transparência faz parte da aliança."]], "q": ["O que ainda precisa de deixar para estar inteiramente unido à sua esposa?", "Como mostra que a sua esposa é parceira e não rival?", "Que áreas escondem vergonha ou segredo no casamento?"]}, "20": {"c": "Paulo escreve a Timóteo sobre como tratar os membros da igreja e como cuidar das viúvas. O versículo 8 é o centro do texto.", "p": [["Tratar todos como família (v. 1-2)", "Os mais velhos como pais, os mais novos como irmãos, as mulheres com toda a pureza. A igreja é uma família."], ["A família cuida primeiro (v. 3-7)", "Os filhos e netos devem retribuir aos que cuidaram deles. A igreja ajuda quem realmente está só."], ["Prover é ato de fé (v. 8)", "Quem não provê para os seus, sobretudo os da sua casa, negou a fé. Prover inclui sustento, presença e atenção."]], "q": ["Está a prover só dinheiro ou também tempo e presença?", "Que familiares precisam do seu cuidado agora?", "Como a sua casa mostra que a sua fé é real?"]}, "21": {"c": "Paulo descreve a vida nova em Cristo e aplica-a à vida em casa. O texto liga o carácter pessoal à paz do lar.", "p": [["Revestir-se (v. 12-14)", "Compaixão, bondade, humildade, mansidão, paciência, perdão e, sobretudo, amor. A casa reflete o que o homem veste."], ["A paz, a Palavra e a gratidão (v. 15-17)", "A paz de Cristo governa o coração, a Palavra habita abundantemente, e tudo se faz em nome do Senhor Jesus."], ["Cada um no seu lugar (v. 18-21)", "Esposas, maridos, filhos e pais têm um chamado. Aos maridos: amar e não ser amargo. Aos pais: não irritar os filhos."]], "q": ["Que destes sete revestimentos lhe falta mais?", "O que governa a sua casa: a paz de Cristo ou o seu humor?", "Em que situação tende a ser amargo com a sua esposa ou os seus filhos?"]}, "22": {"c": "Jesus conta a parábola do pai e dos dois filhos. O estudo fica no filho mais novo e no pai (v. 11-24), imagem do amor de Deus.", "p": [["O pedido e a queda (v. 11-16)", "O filho pede a herança, parte e desperdiça tudo. Acaba a cuidar de porcos, com fome."], ["Cair em si e voltar (v. 17-20a)", "O filho reconhece o erro e decide voltar. Arrepender-se é mudar de direção."], ["O pai que corre (v. 20b-24)", "O pai vê-o de longe, corre, abraça e beija. Veste-o, põe-lhe o anel e faz festa. É assim que Deus recebe, e assim o pai pode agir em casa."]], "q": ["Se um filho seu errasse gravemente, como reagiria?", "Em que relação precisa de dar o primeiro passo?", "Que parte da parábola o consola mais como filho de Deus?"]}, "23": {"c": "O livro de Jó começa a descrever o carácter de um homem antes de contar a sua dor. Os versículos 1 a 5 mostram um pai que ora pelos filhos.", "p": [["Carácter antes de riqueza (v. 1-3)", "Jó era íntegro, reto, temente a Deus e afastado do mal. Só depois se fala dos seus bens."], ["Preocupado com a vida espiritual dos filhos (v. 4-5a)", "Quando os filhos celebravam, Jó pensava que talvez tivessem pecado. Amava-os o bastante para se preocupar com a alma deles."], ["Intercede sempre (v. 5b)", "Jó levantava-se cedo e oferecia sacrifícios por cada um, e fazia-o continuamente. A oração do pai era um hábito."]], "q": ["O que mais ocupa a sua atenção: os bens da casa ou a alma dos seus?", "Ora pelo nome de cada familiar?", "Que hábito de oração pode começar esta semana?"]}, "24": {"c": "Depois de falar dos dons e do amor, Paulo mostra como viver com quem nos faz mal. Este é um dos textos mais práticos sobre a paz.", "p": [["Abençoar e acompanhar (v. 14-16)", "Abençoar os que perseguem, alegrar-se com os que se alegram, chorar com os que choram, e não ser orgulhoso."], ["Procurar a paz (v. 17-18)", "Não pagar mal por mal e, quanto depender de nós, viver em paz com todos. A paz nem sempre depende só de nós, mas a nossa parte é nossa."], ["Vencer o mal com o bem (v. 19-21)", "Deixar a vingança a Deus e responder ao inimigo com bondade. O bem vence o mal."]], "q": ["Com quem tem um conflito que depende de si começar a resolver?", "Que mal recebido precisa de entregar a Deus em vez de se vingar?", "Que gesto de bem pode fazer a quem o magoou?"]}, "25": {"c": "Este é o fecho do Sermão do Monte. Jesus termina com uma história de duas casas.", "p": [["Ouvir e praticar (v. 24-25)", "Quem ouve e pratica é como o homem sábio que edifica sobre a rocha. A casa resiste à chuva, aos rios e ao vento."], ["Ouvir sem praticar (v. 26-27)", "Quem ouve e não pratica edifica sobre a areia. A casa cai, e a queda é grande."], ["A mesma tempestade (v. 25,27)", "A chuva, os rios e o vento vêm às duas casas. A diferença está no fundamento."]], "q": ["Que verdade ouviu muitas vezes e ainda não pratica?", "Que tempestade a sua casa tem enfrentado, e o que a segurou?", "Que hábito de praticar a Palavra pode começar esta semana?"]}, "26": {"c": "O Salmo 127 é um cântico de romagens, atribuído a Salomão. Fala da casa, do trabalho e dos filhos diante de Deus.", "p": [["Sem o Senhor, o esforço é vão (v. 1)", "Quem edifica a casa e quem guarda a cidade trabalham em vão sem o Senhor. O trabalho precisa da bênção de Deus."], ["Deus dá descanso (v. 2)", "Madrugar e comer o pão com sacrifício também é vão: Deus dá o sono aos que ama. Confiar permite descansar."], ["Filhos são herança (v. 3-5)", "Os filhos são herança do Senhor e como flechas na mão do guerreiro. Pede-se ao pai que as prepare e as dirija."]], "q": ["Em que área tenta construir sem Deus?", "Que preocupações o impedem de descansar?", "Como pode preparar os seus filhos como flechas bem dirigidas?"]}, "27": {"c": "Num só dia, Jó perde os bois, as ovelhas, os servos e os dez filhos. O texto mostra como um homem íntegro reage à perda total.", "p": [["Quatro notícias seguidas (v. 13-19)", "Os mensageiros chegam um atrás do outro, sem pausa. A dor de Jó é real e enorme."], ["Luto e adoração (v. 20)", "Jó rasga o manto, rapa a cabeça e prostra-se. Chora e adora no mesmo momento: o luto honesto e a fé não se excluem."], ["O Senhor deu, o Senhor tomou (v. 21-22)", "Jó bendiz o nome do Senhor e não acusa Deus de nada. Reconhece que tudo é dom de Deus."]], "q": ["Como reage quando perde algo importante?", "Que lugar dá ao luto: chora ou esconde?", "Que parte da sua vida precisa de ser entregue de novo a Deus?"]}, "28": {"c": "Jacó morreu. Os irmãos de José temem que ele se vingue agora que o pai já não está.", "p": [["O medo dos irmãos (v. 15-17)", "Eles imaginam o pior e mandam uma mensagem. José chora ao ouvi-la: o seu perdão era sincero, e não foram capazes de o ver."], ["Não estou eu no lugar de Deus (v. 19)", "José recusa fazer de juiz. A vingança pertence a Deus."], ["Deus o tornou em bem (v. 20-21)", "Os irmãos planearam o mal, mas Deus usou-o para salvar muitas vidas. José consola-os e fala ao coração deles."]], "q": ["Quem precisa do seu perdão, ainda que não o tenha pedido?", "Como pode ver a mão de Deus numa situação que lhe fez mal?", "O que o impede de consolar quem o magoou?"]}, "29": {"c": "O Salmo 42 é dos filhos de Corá. O autor está longe do lugar do culto, com sede de Deus e a alma abatida.", "p": [["Sede de Deus (v. 1-4)", "Como a corça que anseia por água, a alma anseia por Deus. Chora e recorda os tempos de comunhão."], ["Falar consigo mesmo (v. 5 e 11)", "Por que estás abatida, minha alma? Ele não ignora a dor: confronta-a e escolhe esperar em Deus."], ["A pergunta dos que zombam (v. 6-10)", "Perguntam onde está o seu Deus. Mesmo no fundo, ele lembra que Deus manda a sua misericórdia de dia e a sua canção de noite."]], "q": ["Quando foi a última vez que sentiu sede de Deus?", "O que diz a si mesmo quando está abatido?", "A quem pode contar a sua dor, em vez de a esconder?"]}, "30": {"c": "Depois da vitória no Carmelo, Elias recebe a ameaça de Jezabel, foge e pede a morte para si. Se algum irmão do grupo se sentir assim, deve procurar um pastor ou um profissional de saúde.", "p": [["Cansaço e desânimo (v. 1-8)", "Elias está exausto, debaixo de um zimbro. Deus manda-o comer, beber e dormir: cuida do corpo antes de falar."], ["A voz mansa e delicada (v. 9-14)", "No Horebe, Deus não está no vento, no terremoto nem no fogo, mas numa voz suave. Elias queixa-se de estar sozinho."], ["Nova missão e outros fiéis (v. 15-18)", "Deus dá-lhe trabalho e diz que há sete mil que não se curvaram a Baal. Elias não estava só."]], "q": ["Quando foi a última vez que descansou de verdade?", "Que voz tem estado a ouvir mais: a do medo ou a de Deus?", "Quem são os irmãos que Deus pôs ao seu lado?"]}, "31": {"c": "Paulo recebeu revelações extraordinárias e depois um espinho na carne. O texto mostra como Deus usa a fraqueza.", "p": [["O espinho (v. 7)", "Foi-lhe dado um espinho para que não se orgulhasse. Deus permite dores para guardar o nosso coração."], ["Pedir e ouvir a resposta (v. 8-9)", "Paulo pediu três vezes que fosse removido. Deus respondeu: a minha graça te basta, o poder aperfeiçoa-se na fraqueza."], ["Gloriar-se nas fraquezas (v. 10)", "Paulo aprendeu a encontrar força na fraqueza. O poder é de Cristo, e não nosso."]], "q": ["Qual é o seu espinho?", "Já pediu a Deus que o tire? O que ouviu de volta?", "Como pode mostrar a sua fraqueza sem vergonha?"]}, "32": {"c": "Davi foi pastor de ovelhas e conhece bem o trabalho. Neste salmo, vê Deus como o seu pastor.", "p": [["O pastor que sustenta (v. 1-3)", "Nada me faltará. Deus dá descanso, água tranquila e guia por caminhos justos."], ["Contigo no vale (v. 4)", "No vale da sombra da morte, Davi não teme, porque Deus está com ele. A vara e o cajado dão segurança."], ["Mesa e casa (v. 5-6)", "Deus prepara a mesa mesmo diante dos inimigos, e a bondade e a misericórdia seguem-no todos os dias."]], "q": ["Em que área precisa de deixar o Pastor conduzir?", "Que vale atravessa agora, e como sente a presença de Deus nele?", "Que bondade de Deus percebe à sua volta?"]}, "33": {"c": "Paulo escreve da prisão aos filipenses e fala de paz e contentamento. Não escreve de uma vida fácil.", "p": [["Oração em vez de ansiedade (v. 6-7)", "Nada de ansiedade: apresentar tudo a Deus com oração e ação de graças. A paz de Deus guarda o coração e a mente."], ["O que ocupa a mente (v. 8-9)", "Pensar no que é verdadeiro, honesto, justo, puro e amável, e praticar o que aprendeu."], ["Contentamento (v. 10-13)", "Paulo aprendeu a viver com pouco e com muito. Tudo posso naquele que me fortalece fala de suportar qualquer situação."]], "q": ["Pelo que está ansioso esta semana?", "O que alimenta a sua mente: o que é bom ou o que o perturba?", "Em que está descontente, e o que aprenderia com Paulo?"]}, "34": {"c": "Tiago escreve a cristãos dispersos e pobres, a sofrer por causa da fé. Fala de como ver a provação.", "p": [["Alegria na prova (v. 2-4)", "A prova da fé produz perseverança, e a perseverança leva à maturidade. A alegria não é pelo sofrimento, mas pelo que ele produz."], ["Pedir sabedoria (v. 5-8)", "Quem precisa de sabedoria deve pedi-la a Deus, que dá generosamente. É preciso pedir com fé, sem dúvida."], ["A coroa da vida (v. 9-12)", "Seja o humilde ou o rico, a riqueza passa. Feliz quem suporta a prova, porque receberá a coroa da vida."]], "q": ["Que prova enfrenta agora?", "Que sabedoria precisa de pedir a Deus?", "Como pode encorajar um irmão que sofre?"]}, "35": {"c": "Depois de lembrar os heróis da fé, o autor de Hebreus convida os leitores a correr a sua própria corrida.", "p": [["Largar o peso e o pecado (v. 1)", "Rodeados de tantas testemunhas, largamos todo o peso e o pecado que nos assedia. Há pesos que não são pecado, mas atrasam."], ["Olhar para Jesus (v. 2)", "Ele é o autor e consumador da fé. Quem olha para Ele não desanima."], ["Considerar quem suportou (v. 3)", "Jesus suportou a oposição dos pecadores. Lembrá-lo evita o cansaço da alma."]], "q": ["Que peso o atrasa na corrida?", "Para onde tem olhado ultimamente?", "Que testemunha de fé o inspira?"]}, "36": {"c": "Nabucodonosor erguera uma estátua de ouro e mandou todos adorá-la. Sadraque, Mesaque e Abede-Nego recusaram.", "p": [["Fé que não depende do resultado (v. 13-18)", "O nosso Deus pode livrar-nos. E, se não, saiba o rei que não serviremos os seus deuses. Fidelidade que não depende do milagre."], ["A fornalha aquecida (v. 19-23)", "O rei manda aquecer a fornalha sete vezes mais, e os homens que os lançaram morrem. A perseguição foi dura."], ["Quatro homens no fogo (v. 24-27)", "O rei vê quatro homens soltos e um deles semelhante a um filho dos deuses. Saem sem sequer o cheiro de fogo."]], "q": ["Que decisão difícil enfrenta por fidelidade a Deus?", "Serviria a Deus mesmo sem milagre?", "Como sentiu a presença de Deus nas suas fornalhas?"]}, "37": {"c": "Depois de explicar a justificação pela fé, Paulo mostra o que ela nos dá: paz e esperança.", "p": [["Paz com Deus (v. 1-2)", "Justificados pela fé, temos paz com Deus e acesso à graça. Não somos mais inimigos."], ["Glória nas tribulações (v. 3-4)", "A tribulação produz paciência, a paciência experiência e a experiência esperança. É uma cadeia que Deus usa."], ["Esperança que não confunde (v. 5)", "O amor de Deus foi derramado nos nossos corações pelo Espírito Santo. A esperança assenta nesse amor."]], "q": ["Como a sua última prova o formou?", "Onde precisa de esperança agora?", "Como sente o amor de Deus derramado no coração?"]}, "38": {"c": "No Sermão do Monte, Jesus fala da ansiedade pela comida, pela roupa e pelo amanhã. Não elogia a preguiça: pede confiança no Pai.", "p": [["Aves e lírios (v. 25-30)", "Deus alimenta as aves e veste os lírios. Vale muito mais o que Deus fez à imagem Dele."], ["O Pai sabe do que precisa (v. 31-32)", "Os que não conhecem a Deus correm atrás destas coisas. O Pai celestial sabe que delas temos necessidade."], ["Buscar primeiro o Reino (v. 33-34)", "Quem põe o Reino em primeiro lugar recebe o resto. Basta a cada dia o seu mal."]], "q": ["Que preocupação financeira o rouba o sono?", "O que tem buscado primeiro?", "Que parte do amanhã precisa de entregar a Deus?"]}, "39": {"c": "Israel está cansado e desanimado no exílio. Isaías lembra quem é o Deus em quem esperam.", "p": [["O Deus que não se cansa (v. 28)", "O Senhor é eterno e criador, e não se cansa nem se fatiga. O seu entendimento é inescrutável."], ["Dá força ao cansado (v. 29-30)", "Dá força ao cansado e multiplica o vigor ao que não tem forças. Até os jovens se cansam e tropeçam."], ["Esperar no Senhor (v. 31)", "Os que esperam no Senhor renovam as forças, sobem com asas como águias, correm e não se cansam, caminham e não se fatigam."]], "q": ["Em que área está cansado?", "O que significa esperar no Senhor na sua rotina?", "Que tempo de silêncio com Deus pode reservar esta semana?"]}, "40": {"c": "Tiago e João pedem a Jesus os lugares de honra no seu reino, e os outros dez ficam indignados. Jesus aproveita para ensinar o que é grandeza.", "p": [["O pedido de honra (v. 35-40)", "Os irmãos querem sentar-se à direita e à esquerda de Jesus. Ele pergunta se podem beber o cálice que Ele vai beber: a glória passa pelo sofrimento."], ["Entre vós não será assim (v. 41-44)", "Os governantes dominam, mas entre os discípulos quem quiser ser grande deve ser servo, e quem quiser ser o primeiro, escravo de todos."], ["O Filho do homem veio servir (v. 45)", "Jesus não veio para ser servido, mas para servir e dar a vida em resgate por muitos. Servimos porque Ele nos serviu."]], "q": ["Que honra procura mais: a de servir ou a de ser visto?", "A quem pode servir esta semana sem esperar nada em troca?", "Que cálice Jesus lhe pede para beber?"]}, "41": {"c": "É a última ceia de Jesus com os discípulos antes da Páscoa. Ele sabe que a hora de partir chegou e faz um gesto que ficou para sempre.", "p": [["Amou até ao fim (v. 1-5)", "Jesus levanta-se, tira as vestes, cinge-se com uma toalha e lava os pés dos discípulos. É tarefa de servo, feita pelo Mestre."], ["Deixar-se servir (v. 6-11)", "Pedro resiste, mas Jesus diz que, se não o lavar, Pedro não terá parte com Ele. Também precisamos de ser lavados."], ["Fazei o mesmo (v. 12-17)", "Se o Senhor e Mestre lavou os pés, os discípulos devem fazer o mesmo uns aos outros. Feliz quem pratica."]], "q": ["Que tarefa humilde evita fazer?", "É difícil deixar-se servir ou ajudar?", "A quem lavaria os pés esta semana?"]}, "42": {"c": "A igreja de Jerusalém cresce, e surge um problema: as viúvas de língua grega são esquecidas na distribuição diária de alimento.", "p": [["Um problema real (v. 1-2)", "Os apóstolos não ignoram a queixa. Reúnem os discípulos e olham para o problema de frente."], ["Homens de bom testemunho (v. 3-4)", "Escolhem sete homens de boa reputação, cheios do Espírito e de sabedoria, para esse serviço, e os apóstolos continuam na oração e na Palavra."], ["Cresce a Palavra (v. 5-7)", "A proposta agrada a todos, escolhem Estêvão e mais seis. A Palavra de Deus crescia e o número dos discípulos multiplicava-se."]], "q": ["Que necessidade concreta existe na sua igreja que ninguém assumiu?", "Que reputação tem entre os que o rodeiam?", "Que serviço podia assumir com seriedade?"]}, "43": {"c": "Paulo escreve a Timóteo, que cuida da igreja de Éfeso, e descreve o carácter de quem lidera e serve. O foco é o homem, e não a função.", "p": [["O líder irrepreensível (v. 1-7)", "Sóbrio, prudente, hospitaleiro, apto a ensinar, sem violência nem amor ao dinheiro, e com boa reputação fora da igreja."], ["Governar bem a própria casa (v. 4-5)", "Quem não sabe cuidar da sua casa não saberá cuidar da igreja de Deus. A casa é o primeiro teste."], ["Servidores provados (v. 8-13)", "Os que servem devem ser sérios, sem duplicidade e provados primeiro. Quem serve bem ganha confiança e ousadia na fé."]], "q": ["Que parte do seu carácter precisa de mais trabalho?", "O que diria a sua família sobre a sua liderança em casa?", "Quem pode avaliar o seu carácter com franqueza?"]}, "44": {"c": "Jetro, sogro de Moisés, visita-o e vê-o a julgar o povo desde a manhã até à tarde. Dá-lhe um conselho que serve a qualquer líder.", "p": [["Não é bom o que fazes (v. 13-18)", "Jetro avisa que Moisés e o povo se esgotarão. O trabalho é pesado demais para fazer sozinho."], ["Escolher e delegar (v. 19-23)", "Moisés ensina as leis e escolhe homens capazes, que temam a Deus, verdadeiros e sem avareza, para dirigir grupos de mil, cem, cinquenta e dez."], ["Moisés ouviu (v. 24-27)", "Moisés aceita o conselho e faz tudo como foi dito. O líder humilde sabe ouvir."]], "q": ["Que tarefas está a carregar sozinho?", "A quem pode confiar uma responsabilidade?", "Quem lhe dá conselhos que prefere não ouvir?"]}, "45": {"c": "Depois de onze capítulos sobre a misericórdia de Deus, Paulo mostra como responder: entrega do corpo, mente renovada e serviço no corpo de Cristo.", "p": [["Sacrifício vivo (v. 1-2)", "Em vista da misericórdia de Deus, oferecemos o corpo como sacrifício vivo. Não nos conformamos com o mundo, mas somos transformados pela renovação da mente."], ["Sem pensar demais de si (v. 3-5)", "Cada um tem a sua medida de fé. Somos um corpo com muitos membros, e cada um precisa dos outros."], ["Dons para servir (v. 6-8)", "Os dons diferem: profecia, serviço, ensino, exortação, contribuição, liderança, misericórdia. Todos se exercem com dedicação."]], "q": ["Que parte da sua vida ainda não entregou a Deus?", "Qual é o seu dom e como o usa na igreja?", "De que irmãos precisa para completar o que lhe falta?"]}, "46": {"c": "É o fim do Evangelho de Mateus. O Jesus ressuscitado encontra os onze discípulos num monte da Galileia e dá-lhes a missão da igreja.", "p": [["Adoração e dúvida (v. 16-17)", "Os discípulos adoram, mas alguns duvidam. Jesus não os põe de lado: envia-os assim mesmo."], ["Toda a autoridade (v. 18-19)", "Jesus tem toda a autoridade no céu e na terra. Por isso manda ir, fazer discípulos e baptizar."], ["Estou convosco (v. 20)", "Ensinar a guardar tudo o que Jesus mandou, com a promessa da sua presença até ao fim dos tempos."]], "q": ["Com quem pode falar de Jesus esta semana?", "Que dúvida o prende e a quem a pode confiar?", "Quem pode discipular e quem o discipula?"]}, "47": {"c": "O pregador de Eclesiastes fala do trabalho vazio de quem não tem ninguém. Em seguida mostra o valor da companhia.", "p": [["Melhor dois que um (v. 9-10)", "Os dois têm melhor recompensa pelo seu trabalho. Se um cair, o outro levanta-o. Ai de quem cai e não tem quem o levante."], ["Aquecer-se juntos (v. 11)", "Dois deitados aquecem-se. Companheiros dão calor e apoio nas noites frias."], ["A corda de três dobras (v. 12)", "Um sozinho pode ser vencido, dois podem resistir, e a corda de três dobras não se rompe depressa. Com Deus no meio, a aliança é forte."]], "q": ["Quem o levanta quando cai?", "Com que irmão pode fazer uma aliança de prestação de contas?", "Que lugar dá a Deus nas suas amizades?"]}, "48": {"c": "Paulo escreve da prisão aos efésios. Depois de três capítulos sobre o que Deus fez, pede uma vida digna do chamado e fala da unidade do corpo.", "p": [["Caminhar dignamente (v. 1-6)", "Humildade, mansidão, paciência e amor, empenhando-se em manter a unidade do Espírito. Há um só corpo, um só Espírito, um só Senhor."], ["Dons para o serviço (v. 7-12)", "Cristo dá apóstolos, profetas, evangelistas, pastores e mestres para preparar os santos para a obra do ministério."], ["Crescer em amor (v. 13-16)", "A verdade dita em amor faz-nos crescer até à maturidade. Cada parte do corpo tem a sua função."]], "q": ["Que atitudes ameaçam a unidade no seu grupo?", "Como pode dizer a verdade em amor a um irmão?", "O que o impede de crescer até à maturidade?"]}, "49": {"c": "Paulo escreve a Tito, que cuida das igrejas em Creta. Pede uma vida que combine com o ensino são, para todas as idades.", "p": [["Os homens mais velhos (v. 1-2)", "Sóbrios, graves, prudentes, sãos na fé, no amor e na paciência. A maturidade é um ministério."], ["Os jovens (v. 6)", "Paulo exorta-os a serem sensatos. Os jovens precisam de exemplos próximos."], ["Ser exemplo em tudo (v. 7-8)", "Tito deve mostrar boas obras, integridade e seriedade no ensino, para que os adversários fiquem sem o que dizer."]], "q": ["Que exemplo vê em si um rapaz mais novo?", "Quem o acompanhou quando era jovem?", "O que precisa de mudar para ser exemplo em tudo?"]}, "50": {"c": "Paulo escreve a Timóteo, o seu filho na fé, quando já está preso e perto do fim. Pede-lhe que passe adiante o que aprendeu.", "p": [["Quatro gerações (v. 1-2)", "Paulo ensinou Timóteo, Timóteo confia a homens fiéis, que ensinarão outros. A fé passa de mão em mão."], ["Soldado e atleta (v. 3-5)", "O soldado não se envolve em negócios da vida civil para agradar a quem o alistou. O atleta compete segundo as regras."], ["Lavrador paciente (v. 6-7)", "O lavrador que trabalha deve ser o primeiro a participar dos frutos. Paulo pede a Timóteo que reflicta no que diz."]], "q": ["A quem está a ensinar o que aprendeu?", "Que distrações o afastam do chamado?", "Que homem fiel pode começar a discipular?"]}, "51": {"c": "Paulo fecha a carta aos gálatas com conselhos sobre o viver cristão: semear, não desanimar e fazer o bem a todos.", "p": [["Deus não se zomba (v. 7-8)", "O que o homem semear, isso colherá. Semear para a carne dá corrupção, e semear para o Espírito dá vida eterna."], ["Não nos cansemos (v. 9)", "Não nos cansemos de fazer o bem, porque a seu tempo colheremos, se não desfalecermos."], ["Fazer o bem a todos (v. 10)", "Enquanto temos oportunidade, façamos o bem a todos, mas principalmente aos da família da fé."]], "q": ["O que tem semeado nos últimos meses?", "Em que boa obra está a ficar cansado?", "Quem na igreja precisa do seu bem esta semana?"]}, "52": {"c": "Paulo está preso e perto do fim da vida. Estas são das últimas palavras que escreveu, dirigidas a Timóteo.", "p": [["O tempo da partida (v. 6)", "Paulo sente-se como oferta derramada. Encara a morte com serenidade, porque vive para Cristo."], ["Combati, acabei, guardei (v. 7)", "Ele resume a vida em três ideias: combateu o bom combate, terminou a carreira e guardou a fé."], ["A coroa de justiça (v. 8)", "Paulo espera a coroa que o Senhor dará, e promete-a a todos os que amam a sua vinda."]], "q": ["Se hoje tivesse de resumir a sua vida em três frases, o que diria?", "Que combate precisa de continuar a lutar?", "Como pode terminar bem o próximo ano?"]}};const Q=["O homem que teme ao Senhor", "O homem que edifica a sua casa", "O homem de fé nas provações", "O homem que serve e lidera"];const S=new Date(2027,0,3);const FOOT="Igreja Comunidade Esperança · Boane · Ministério dos Homens · 2027 · Autor: Gabriel Amós Chissano";
const st=JSON.parse(localStorage.getItem("hmd")||"{}");const A=document.getElementById("app");
const cur=()=>Math.min(52,Math.max(1,Math.floor((Date.now()-S)/6048e5)+1));
const fd=n=>{const d=new Date(S);d.setDate(d.getDate()+7*(n-1));return d.toLocaleDateString("pt-PT")};
const tg=(k,v)=>{st[k]=v;localStorage.setItem("hmd",JSON.stringify(st))};
const D=[["Segunda","Ler e observar","p","Leia {r} com calma. Sublinhe uma palavra ou frase que lhe chame a atenção.","O que o texto diz?","Senhor, abre os meus olhos para a tua Palavra. Amém."],
["Terça","O que mostra sobre Deus","p","Releia {r}. O que este texto mostra sobre quem Deus é?","Que qualidade de Deus vejo aqui?","Pai, ajuda-me a conhecer-te melhor. Amém."],
["Quarta","O que diz sobre mim","p","A ideia central da semana: {i} Que parte da sua vida isto toca?","Onde preciso de crescer nisto?","Senhor, trabalha em mim esta verdade. Amém."],
["Quinta","Colocar em prática","p","Escolha uma atitude concreta para viver hoje a verdade desta semana.","Que passo posso dar hoje?","Deus, dá-me força para obedecer hoje. Amém."],
["Sexta","Orar a Palavra","v","Transforme {r} numa oração, com as suas próprias palavras.","Que pedido e que agradecimento nascem deste versículo?","Senhor, ensina-me a orar a tua Palavra. Amém."],
["Sábado","Guardar no coração","v","Escreva {r} num cartão e repita-o em voz alta durante o dia.","Consigo dizer o versículo de memória?","Pai, guarda a tua Palavra no meu coração. Amém."],
["Domingo","Preparar o encontro","p","Releia os seus apontamentos, ore pelo grupo e pelo encontro.","O que quero partilhar com os irmãos?","Senhor, prepara os nossos corações para este encontro. Amém."]];
const G=["Observar: o que o texto diz? Quem são as pessoas e o que acontece?","Entender: o que este texto mostra sobre Deus?","Entender: o que ensina sobre nós, homens?","Em que área da vida (casa, trabalho, igreja) esta verdade me desafia?","Aplicar: que passo prático darei esta semana?","Como podemos orar uns pelos outros e prestar contas?"];
const nb=a=>document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==a));
const foot=`<footer>${FOOT}</footer>`;
const bar=(v,m)=>`<div class="bar"><i style="width:${100*v/m}%"></i></div>`;
function lista(){let h=`<h1>Programa de 52 semanas</h1><p class="sub">Toque numa semana para abrir.</p>`;
W.forEach((w,i)=>{if(i%13==0)h+=`<h2>${i/13+1}º trimestre · ${Q[i/13]}</h2>`;
h+=`<div class="row" onclick="show(${i+1},0)"><b>${i+1}</b><span>${w.t}<small>${w.p} · ${fd(i+1)}</small></span><em>${st["c"+(i+1)]?"✓":""}</em></div>`});
A.innerHTML=h+foot;nb("p");scrollTo(0,0)}
function prog(){let c=0,d=0;W.forEach((w,i)=>{if(st["c"+(i+1)])c++;for(let j=0;j<7;j++)if(st["d"+(i+1)+"_"+j])d++});
let h=`<h1>O meu progresso</h1><div class="card"><h3>🚀 Desafios cumpridos</h3><p><b>${c}</b> de 52</p>${bar(c,52)}</div><div class="card"><h3>📖 Dias de devocional feitos</h3><p><b>${d}</b> de 364</p>${bar(d,364)}</div>`;
Q.forEach((q,k)=>{let x=0;for(let i=k*13+1;i<=k*13+13;i++)if(st["c"+i])x++;h+=`<div class="card"><h3>${k+1}º trimestre</h3><p>${q}</p><p class="sub">Desafios: ${x} de 13</p>${bar(x,13)}</div>`});
A.innerHTML=h+foot;nb("g");scrollTo(0,0)}
function sobre(){A.innerHTML=`<h1>Homens Moldados por Deus</h1><p class="sub">Ministério dos Homens · Igreja Comunidade Esperança · Boane</p>
<div class="card"><h3>📖 O programa</h3><p>52 semanas em 4 trimestres. Em cada semana: estudo em grupo, devocional de 7 dias e um desafio prático.</p></div>
<div class="card"><h3>🧭 Como usar</h3><ol><li><b>Início</b> abre a semana actual.</li><li><b>Programa</b> lista as 52 semanas.</li><li><b>Progresso</b> mostra o que já cumpriu.</li><li>Em cada semana, use as abas <b>Estudo</b>, <b>Devocional</b> e <b>Desafio</b>.</li></ol></div>
<div class="card"><h3>🗂️ Os trimestres</h3><ol>${Q.map(q=>`<li>${q}</li>`).join("")}</ol></div>

function show(n,tab=0){const w=W[n-1],e=E[n],qi=Math.floor((n-1)/13),N=String(n).padStart(2,"0");
const ck=(k,l)=>`<label class="ck"><input type="checkbox" ${st[k]?"checked":""} onchange="tg('${k}',this.checked)"> ${l}</label>`;
